# Codemagic CI/CD Configuration for Capacitor iOS Build
# For details, see: https://docs.codemagic.io/yaml-basic/yaml-getting-started/

workflows:
  ios-build:
    name: iOS Capacitor App Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      # Replace this with the exact "Name" or "Label" of your App Store Connect 
      # API Key integration as shown in your Codemagic UI (User Settings -> Integrations).
      app_store_connect: tp
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - ios-credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Node Dependencies
        script: |
          npm ci
      - name: Compile Web Assets
        script: |
          npm run build
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Build Code-Signed iOS IPA
        script: |
          # Compiles and exports the fully signed production IPA package.
          # Codemagic automatically detects the CM_CERTIFICATE and CM_PROVISIONING_PROFILE
          # environment variables and installs them into the keychain beforehand!
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - arash.tajdar@gmail.com
      app_store_connect:
        auth: integration  # Uses your connected Developer Portal integration in Codemagic UI
        submit_to_testflight: true
