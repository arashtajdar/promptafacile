# Codemagic CI/CD Configuration for Capacitor iOS Build
# For details, see: https://docs.codemagic.io/yaml-basic/yaml-getting-started/

workflows:
  ios-build:
    name: iOS Capacitor App Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      # Replace this with the exact "Name" or "Label" of your App Store Connect 
      # API Key integration as shown in your Codemagic UI (User Settings -> Integrations).
      app_store_connect: tp
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - ios-credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Node Dependencies
        script: |
          npm ci
      - name: Compile Web Assets
        script: |
          npm run build
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Create ExportOptions.plist
        script: |
          # Generates the exact Xcode export configuration for the app-store submission
          cat <<EOF > /tmp/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>ND24U8LL54</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.promptafacile.teleprompter</key>
                  <string>f1d658d3-f218-460e-9f7b-c7df36dd3457</string>
              </dict>
          </dict>
          </plist>
          EOF
      - name: Build Code-Signed iOS IPA
        script: |
          # Compiles and exports the fully signed production IPA package using our custom ExportOptions plist.
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - arash.tajdar@gmail.com
      app_store_connect:
        auth: integration  # Uses your connected Developer Portal integration in Codemagic UI
        submit_to_testflight: true
