# Codemagic CI/CD Configuration for Capacitor iOS Build
# For details, see: https://docs.codemagic.io/yaml-basic/yaml-getting-started/

workflows:
  ios-build:
    name: iOS Capacitor App Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      # Replace this with the exact "Name" or "Label" of your App Store Connect 
      # API Key integration as shown in your Codemagic UI (User Settings -> Integrations).
      app_store_connect: tp
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Node Dependencies
        script: |
          npm ci
      - name: Compile Web Assets
        script: |
          npm run build
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Fetch Apple Signing Profiles
        script: |
          # Automatically downloads signing certificates and provisioning profiles
          # from your connected App Store Connect developer account
          app-store-connect fetch-signing-files --platform IOS --type IOS_APP_STORE "com.teleprompter.app"
      - name: Apply Signing Profiles to Xcode
        script: |
          # Modifies the Xcode project to use the fetched provisioning profile
          xcode-project use-profiles
      - name: Build Code-Signed iOS IPA
        script: |
          # Compiles and exports a fully signed production IPA package
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - arash.tajdar@gmail.com
      app_store_connect:
        auth: integration  # Uses your connected Developer Portal integration in Codemagic UI
        submit_to_testflight: true
