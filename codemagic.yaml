# Codemagic CI/CD Configuration for Capacitor iOS Build
# For details, see: https://docs.codemagic.io/yaml-basic/yaml-getting-started/

workflows:
  ios-build:
    name: iOS Capacitor App Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      # Replace this with the exact "Name" or "Label" of your App Store Connect 
      # API Key integration as shown in your Codemagic UI (User Settings -> Integrations).
      app_store_connect: tp
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - ios-credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Node Dependencies
        script: |
          npm ci
      - name: Compile Web Assets
        script: |
          npm run build
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Install Code-Signing Credentials
        script: |
          # Create standard Mac provisioning directory
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # Decode the profile base64 string to a mobileprovision file
          echo $CM_PROVISIONING_PROFILE | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/tp_profile.mobileprovision
          
          # Decode the certificate p12 base64 string to a temporary p12 file
          echo $CM_CERTIFICATE | base64 --decode > /tmp/ios.p12
          
          # Initialize keychain and import the certificate
          keychain initialize
          keychain add-certificates --pkcs12 /tmp/ios.p12
      - name: Build Code-Signed iOS IPA
        script: |
          # Compiles and exports the fully signed production IPA package.
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - arash.tajdar@gmail.com
      app_store_connect:
        auth: integration  # Uses your connected Developer Portal integration in Codemagic UI
        submit_to_testflight: true
